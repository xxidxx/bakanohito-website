<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a72ef;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5e6ad2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#de1d8d;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with subtle gradient -->
  <circle cx="64" cy="64" r="60" fill="url(#grad)" opacity="0.12"/>
  
  <!-- Outer ring -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  
  <!-- Main symbol: Stylized 'B' formed by neural network nodes and connections -->
  <g filter="url(#glow)">
    <!-- Neural network nodes -->
    <circle cx="38" cy="38" r="6" fill="url(#grad)"/>
    <circle cx="90" cy="38" r="6" fill="url(#grad)"/>
    <circle cx="38" cy="90" r="6" fill="url(#grad)"/>
    <circle cx="90" cy="90" r="6" fill="url(#grad)"/>
    <circle cx="64" cy="64" r="8" fill="url(#grad)"/>
    
    <!-- Connections forming a 'B' shape -->
    <path d="M38 38 L64 38 L64 64 L90 64 L90 90 L64 90 L64 64 L38 64" 
          stroke="url(#grad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    
    <!-- Additional connections for depth -->
    <path d="M38 38 L64 64" stroke="url(#grad)" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M90 38 L64 64" stroke="url(#grad)" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M38 90 L64 64" stroke="url(#grad)" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M90 90 L64 64" stroke="url(#grad)" stroke-width="2" fill="none" opacity="0.4"/>
  </g>
  
  <!-- Pulse indicator -->
  <circle cx="90" cy="38" r="10" fill="none" stroke="#0a72ef" stroke-width="2" opacity="0.5">
    <animate attributeName="r" values="10;14;10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>