<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1011;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#191a1b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0a72ef;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#5e6ad2;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#de1d8d;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a72ef;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5e6ad2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#de1d8d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="240" fill="url(#bgGrad)" rx="12"/>
  <rect x="4" y="4" width="392" height="232" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" rx="8"/>
  
  <!-- Dashboard header -->
  <rect x="20" y="20" width="120" height="28" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="80" y="39" font-family="'Geist', sans-serif" font-size="11" font-weight="500" fill="#d0d6e0" text-anchor="middle">Eval Dashboard</text>
  
  <rect x="150" y="20" width="100" height="28" rx="4" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="200" y="39" font-family="'Geist', sans-serif" font-size="11" font-weight="500" fill="#10b981" text-anchor="middle">PASSING</text>
  
  <rect x="260" y="20" width="120" height="28" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="320" y="39" font-family="'Geist', sans-serif" font-size="11" font-weight="500" fill="#8a8f98" text-anchor="middle">Last run: 2m ago</text>
  
  <!-- Main chart area -->
  <rect x="20" y="60" width="360" height="160" fill="#08090a" rx="8"/>
  
  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="60" y1="70" x2="370" y2="70"/>
    <line x1="60" y1="100" x2="370" y2="100"/>
    <line x1="60" y1="130" x2="370" y2="130"/>
    <line x1="60" y1="160" x2="370" y2="160"/>
    <line x1="60" y1="190" x2="370" y2="190"/>
    <line x1="60" y1="220" x2="370" y2="220"/>
    <line x1="60" y1="70" x2="60" y2="220"/>
    <line x1="130" y1="70" x2="130" y2="220"/>
    <line x1="200" y1="70" x2="200" y2="220"/>
    <line x1="270" y1="70" x2="270" y2="220"/>
    <line x1="340" y1="70" x2="340" y2="220"/>
  </g>
  
  <!-- Y-axis labels -->
  <g font-family="'Geist Mono', monospace" font-size="9" fill="#62666d" text-anchor="end">
    <text x="55" y="74">1.00</text>
    <text x="55" y="104">0.80</text>
    <text x="55" y="134">0.60</text>
    <text x="55" y="164">0.40</text>
    <text x="55" y="194">0.20</text>
    <text x="55" y="224">0.00</text>
  </g>
  
  <!-- X-axis labels -->
  <g font-family="'Geist Mono', monospace" font-size="9" fill="#62666d" text-anchor="middle">
    <text x="80" y="230">Run 1</text>
    <text x="150" y="230">Run 5</text>
    <text x="220" y="230">Run 10</text>
    <text x="290" y="230">Run 15</text>
    <text x="360" y="230">Run 20</text>
  </g>
  
  <!-- Area chart - Quality Score -->
  <path d="M60 220 
           L80 180
           L100 165
           L120 155
           L140 140
           L160 130
           L180 125
           L200 115
           L220 105
           L240 100
           L260 92
           L280 88
           L300 82
           L320 78
           L340 75
           L360 72
           L360 220 Z" 
        fill="url(#chartGrad)" opacity="0.3"/>
  
  <!-- Line chart -->
  <path d="M60 180 
           C90 170, 110 155, 120 155
           C130 155, 150 135, 160 130
           C170 125, 190 120, 200 115
           C210 110, 230 102, 240 100
           C250 98, 270 90, 280 88
           C290 86, 310 80, 320 78
           C330 76, 350 73, 360 72" 
        fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#nodeGlow)"/>
  
  <!-- Data points -->
  <g>
    <circle cx="80" cy="180" r="4" fill="#0a72ef"/>
    <circle cx="120" cy="155" r="4" fill="#5e6ad2"/>
    <circle cx="160" cy="130" r="4" fill="#5e6ad2"/>
    <circle cx="200" cy="115" r="4" fill="#de1d8d"/>
    <circle cx="240" cy="100" r="4" fill="#de1d8d"/>
    <circle cx="280" cy="88" r="4" fill="#de1d8d"/>
    <circle cx="320" cy="78" r="4" fill="#de1d8d"/>
    <circle cx="360" cy="72" r="4" fill="#de1d8d"/>
  </g>
  
  <!-- Metric cards at bottom -->
  <g font-family="'Geist', sans-serif">
    <!-- Accuracy -->
    <rect x="20" y="225" width="85" height="35" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="30" y="242" font-size="10" fill="#8a8f98">ACCURACY</text>
    <text x="30" y="256" font-size="16" font-weight="600" fill="#10b981">94.2%</text>
    <text x="85" y="256" font-size="9" fill="#10b981" text-anchor="end">+2.1%</text>
    
    <!-- Latency -->
    <rect x="115" y="225" width="85" height="35" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="125" y="242" font-size="10" fill="#8a8f98">LATENCY</text>
    <text x="125" y="256" font-size="16" font-weight="600" fill="#f7f8f8">1.2s</text>
    <text x="180" y="256" font-size="9" fill="#10b981" text-anchor="end">-0.3s</text>
    
    <!-- Cost -->
    <rect x="210" y="225" width="85" height="35" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="220" y="242" font-size="10" fill="#8a8f98">COST/1K</text>
    <text x="220" y="256" font-size="16" font-weight="600" fill="#f7f8f8">$0.04</text>
    <text x="275" y="256" font-size="9" fill="#febc2e" text-anchor="end">±0%</text>
    
    <!-- Pass Rate -->
    <rect x="305" y="225" width="85" height="35" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="315" y="242" font-size="10" fill="#8a8f98">PASS RATE</text>
    <text x="315" y="256" font-size="16" font-weight="600" fill="#f7f8f8">98%</text>
    <text x="370" y="256" font-size="9" fill="#10b981" text-anchor="end">+1%</text>
  </g>
  
  <!-- Trend indicator -->
  <path d="M200 115 L210 105 L220 115" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="225" y="110" font-family="'Geist Mono', monospace" font-size="10" fill="#10b981">Trending ↑</text>
</svg>