<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <!-- Project: Internal Developer Platform -->
  <defs>
    <linearGradient id="grad-proj2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7170ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0a72ef;stop-opacity:0.15"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="240" fill="url(#grad-proj2)" rx="12"/>
  <rect width="400" height="240" fill="none" stroke="#7170ff" stroke-width="1" stroke-opacity="0.3" rx="12"/>
  
  <text x="30" y="35" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#7170ff">Bakanohito Internal • 2023</text>
  <text x="30" y="55" font-family="Geist, sans-serif" font-size="18" font-weight="600" fill="#08090a">Developer Platform (IDP)</text>
  <text x="30" y="78" font-family="Geist, sans-serif" font-size="13" fill="#4d4d4d">Self-serve infrastructure platform for ML/AI workloads — built on Kubernetes, Backstage, and Bakanohito Gateway</text>
  
  <g font-family="Geist, sans-serif" font-size="10" font-weight="500">
    <rect x="30" y="95" width="80" height="24" rx="4" fill="#7170ff" fill-opacity="0.15" stroke="#7170ff" stroke-width="1"/>
    <text x="70" y="112" fill="#7170ff" text-anchor="middle">Kubernetes</text>
    
    <rect x="120" y="95" width="70" height="24" rx="4" fill="#0a72ef" fill-opacity="0.15" stroke="#0a72ef" stroke-width="1"/>
    <text x="155" y="112" fill="#0a72ef" text-anchor="middle">Backstage</text>
    
    <rect x="200" y="95" width="80" height="24" rx="4" fill="#de1d8d" fill-opacity="0.15" stroke="#de1d8d" stroke-width="1"/>
    <text x="240" y="112" fill="#de1d8d" text-anchor="middle">ArgoCD</text>
    
    <rect x="290" y="95" width="80" height="24" rx="4" fill="#27ca4f" fill-opacity="0.15" stroke="#27ca4f" stroke-width="1"/>
    <text x="330" y="112" fill="#27ca4f" text-anchor="middle">Prometheus</text>
  </g>
  
  <rect x="30" y="135" width="340" height="85" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  
  <text x="50" y="155" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#7170ff">Impact</text>
  
  <g font-family="Geist, sans-serif" font-size="12">
    <text x="50" y="180" font-weight="600" fill="#7170ff">85%</text>
    <text x="50" y="195" fill="#666666">Deploy time reduction</text>
    
    <text x="170" y="180" font-weight="600" fill="#7170ff">120+</text>
    <text x="170" y="195" fill="#666666">Daily active developers</text>
    
    <text x="290" y="180" font-weight="600" fill="#7170ff">Zero</text>
    <text x="290" y="195" fill="#666666">Config drift incidents</text>
  </g>
  
  <line x1="150" y1="145" x2="150" y2="210" stroke="#ebebeb" stroke-width="1"/>
  <line x1="270" y1="145" x2="270" y2="210" stroke="#ebebeb" stroke-width="1"/>
  
  <rect x="300" y="20" width="70" height="24" rx="4" fill="#7170ff" fill-opacity="0.15" stroke="#7170ff" stroke-width="1"/>
  <text x="335" y="37" font-family="Geist, sans-serif" font-size="10" font-weight="500" fill="#7170ff" text-anchor="middle">Open Source</text>
</svg>