<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <!-- Project: Pertamax Green 95 Marketing AI -->
  <defs>
    <linearGradient id="grad-proj1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6e4f;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0d4d33;stop-opacity:0.15"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="240" fill="url(#grad-proj1)" rx="12"/>
  <rect width="400" height="240" fill="none" stroke="#1a6e4f" stroke-width="1" stroke-opacity="0.3" rx="12"/>
  
  <!-- Header -->
  <text x="30" y="35" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#1a6e4f">Pertamina • 2024</text>
  <text x="30" y="55" font-family="Geist, sans-serif" font-size="18" font-weight="600" fill="#0d4d33">Pertamax Green 95 Marketing AI</text>
  <text x="30" y="78" font-family="Geist, sans-serif" font-size="13" fill="#4d4d4d" style="font-weight:400">AI-powered market analysis & campaign optimization for Indonesia's premium fuel launch</text>
  
  <!-- Tech stack badges -->
  <g font-family="Geist, sans-serif" font-size="10" font-weight="500">
    <rect x="30" y="95" width="70" height="24" rx="4" fill="#1a6e4f" fill-opacity="0.15" stroke="#1a6e4f" stroke-width="1"/>
    <text x="65" y="112" fill="#1a6e4f" text-anchor="middle">Claude 3.5</text>
    
    <rect x="110" y="95" width="70" height="24" rx="4" fill="#0a72ef" fill-opacity="0.15" stroke="#0a72ef" stroke-width="1"/>
    <text x="145" y="112" fill="#0a72ef" text-anchor="middle">LangChain</text>
    
    <rect x="190" y="95" width="70" height="24" rx="4" fill="#de1d8d" fill-opacity="0.15" stroke="#de1d8d" stroke-width="1"/>
    <text x="225" y="112" fill="#de1d8d" text-anchor="middle">RAG Pipeline</text>
    
    <rect x="270" y="95" width="70" height="24" rx="4" fill="#7170ff" fill-opacity="0.15" stroke="#7170ff" stroke-width="1"/>
    <text x="305" y="112" fill="#7170ff" text-anchor="middle">Eval Suite</text>
  </g>
  
  <!-- Results -->
  <rect x="30" y="135" width="340" height="85" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  
  <text x="50" y="155" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#1a6e4f">Key Results</text>
  
  <g font-family="Geist, sans-serif" font-size="12">
    <!-- Metric 1 -->
    <text x="50" y="180" font-weight="600" fill="#1a6e4f">+34%</text>
    <text x="50" y="195" fill="#666666">Brand awareness lift</text>
    
    <!-- Metric 2 -->
    <text x="170" y="180" font-weight="600" fill="#1a6e4f">2.8x</text>
    <text x="170" y="195" fill="#666666">Content velocity</text>
    
    <!-- Metric 3 -->
    <text x="290" y="180" font-weight="600" fill="#1a6e4f">47%</text>
    <text x="290" y="195" fill="#666666">Cost reduction</text>
  </g>
  
  <!-- Divider lines -->
  <line x1="150" y1="145" x2="150" y2="210" stroke="#ebebeb" stroke-width="1"/>
  <line x1="270" y1="145" x2="270" y2="210" stroke="#ebebeb" stroke-width="1"/>
  
  <!-- Tag -->
  <rect x="300" y="20" width="70" height="24" rx="4" fill="#1a6e4f" fill-opacity="0.15" stroke="#1a6e4f" stroke-width="1"/>
  <text x="335" y="37" font-family="Geist, sans-serif" font-size="10" font-weight="500" fill="#1a6e4f" text-anchor="middle">Enterprise</text>
</svg>