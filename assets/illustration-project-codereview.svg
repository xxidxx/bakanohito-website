<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <!-- Project: AI Code Review Bot -->
  <defs>
    <linearGradient id="grad-proj3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#de1d8d;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ff5b4f;stop-opacity:0.15"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="240" fill="url(#grad-proj3)" rx="12"/>
  <rect width="400" height="240" fill="none" stroke="#de1d8d" stroke-width="1" stroke-opacity="0.3" rx="12"/>
  
  <text x="30" y="35" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#de1d8d">Open Source • 2024</text>
  <text x="30" y="55" font-family="Geist, sans-serif" font-size="18" font-weight="600" fill="#08090a">AI Code Review Bot</text>
  <text x="30" y="78" font-family="Geist, sans-serif" font-size="13" fill="#4d4d4d">GitHub App that reviews PRs using local LLMs — 2.3k stars, used by 340+ teams</text>
  
  <g font-family="Geist, sans-serif" font-size="10" font-weight="500">
    <rect x="30" y="95" width="70" height="24" rx="4" fill="#de1d8d" fill-opacity="0.15" stroke="#de1d8d" stroke-width="1"/>
    <text x="65" y="112" fill="#de1d8d" text-anchor="middle">GitHub App</text>
    
    <rect x="110" y="95" width="70" height="24" rx="4" fill="#0a72ef" fill-opacity="0.15" stroke="#0a72ef" stroke-width="1"/>
    <text x="145" y="112" fill="#0a72ef" text-anchor="middle">Ollama</text>
    
    <rect x="190" y="95" width="70" height="24" rx="4" fill="#7170ff" fill-opacity="0.15" stroke="#7170ff" stroke-width="1"/>
    <text x="225" y="112" fill="#7170ff" text-anchor="middle">TypeScript</text>
    
    <rect x="270" y="95" width="80" height="24" rx="4" fill="#27ca4f" fill-opacity="0.15" stroke="#27ca4f" stroke-width="1"/>
    <text x="310" y="112" fill="#27ca4f" text-anchor="middle">MIT License</text>
  </g>
  
  <rect x="30" y="135" width="340" height="85" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  
  <text x="50" y="155" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#de1d8d">Metrics</text>
  
  <g font-family="Geist, sans-serif" font-size="12">
    <text x="50" y="180" font-weight="600" fill="#de1d8d">2.3k</text>
    <text x="50" y="195" fill="#666666">GitHub Stars</text>
    
    <text x="170" y="180" font-weight="600" fill="#de1d8d">340+</text>
    <text x="170" y="195" fill="#666666">Active Installations</text>
    
    <text x="290" y="180" font-weight="600" fill="#de1d8d">99.2%</text>
    <text x="290" y="195" fill="#666666">Uptime (90 days)</text>
  </g>
  
  <line x1="150" y1="145" x2="150" y2="210" stroke="#ebebeb" stroke-width="1"/>
  <line x1="270" y1="145" x2="270" y2="210" stroke="#ebebeb" stroke-width="1"/>
  
  <rect x="300" y="20" width="70" height="24" rx="4" fill="#de1d8d" fill-opacity="0.15" stroke="#de1d8d" stroke-width="1"/>
  <text x="335" y="37" font-family="Geist, sans-serif" font-size="10" font-weight="500" fill="#de1d8d" text-anchor="middle">Community</text>
</svg>