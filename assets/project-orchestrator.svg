<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e5e5" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- Canvas with nodes -->
  <rect x="30" y="30" width="340" height="220" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  
  <!-- Nodes (prompt chain) -->
  <!-- Node 1: Input -->
  <rect x="50" y="90" width="100" height="60" rx="8" fill="#ebf5ff" stroke="#0068d6" stroke-width="1.5"/>
  <text x="100" y="115" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#0068d6" text-anchor="middle">User Input</text>
  <text x="100" y="132" font-family="Geist Mono, monospace" font-size="9" fill="#0068d6" text-anchor="middle">"Summarize PR #247"</text>
  
  <!-- Arrow 1 -->
  <path d="M150 120 L190 120" stroke="#0a72ef" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Node 2: Classify -->
  <rect x="190" y="40" width="100" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="240" y="65" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle">Classify</text>
  <text x="240" y="82" font-family="Geist Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">Intent: summarize</text>
  
  <!-- Arrow 2 -->
  <path d="M240 100 L240 130" stroke="#0a72ef" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Node 3: Retrieve -->
  <rect x="190" y="130" width="100" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="240" y="155" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Retrieve</text>
  <text x="240" y="172" font-family="Geist Mono, monospace" font-size="9" fill="#16a34a" text-anchor="middle">Context: 12 files</text>
  
  <!-- Arrow 3 -->
  <path d="M290 120 L330 120" stroke="#0a72ef" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Node 4: Generate -->
  <rect x="330" y="90" width="100" height="60" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="380" y="115" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#ec4899" text-anchor="middle">Generate</text>
  <text x="380" y="132" font-family="Geist Mono, monospace" font-size="9" fill="#ec4899" text-anchor="middle">LLM: gpt-4o</text>
  
  <!-- Connections from classify/retrieve to generate -->
  <path d="M290 70 Q310 70 310 90" stroke="#0a72ef" stroke-width="1.5" fill="none" opacity="0.6" stroke-dasharray="4,4"/>
  <path d="M290 150 Q310 150 310 130" stroke="#0a72ef" stroke-width="1.5" fill="none" opacity="0.6" stroke-dasharray="4,4"/>
  
  <!-- Output -->
  <rect x="50" y="180" width="300" height="50" rx="8" fill="#171717"/>
  <text x="70" y="205" font-family="Geist Mono, monospace" font-size="9" fill="#4ade80">$ PR #247: Refactor auth middleware → JWT validation,</text>
  <text x="70" y="220" font-family="Geist Mono, monospace" font-size="9" fill="#4ade80">  rate limiting, and session cleanup. 3 files changed.</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0a72ef"/>
    </marker>
  </defs>
  
  <!-- Version badge -->
  <rect x="30" y="260" width="80" height="24" rx="4" fill="#0a72ef" opacity="0.1"/>
  <text x="70" y="276" font-family="Geist, sans-serif" font-size="10" font-weight="500" fill="#0a72ef" text-anchor="middle">v2.1.0</text>
  
  <rect x="120" y="260" width="100" height="24" rx="4" fill="#171717" opacity="0.1"/>
  <text x="170" y="276" font-family="Geist, sans-serif" font-size="10" font-weight="500" fill="#666666" text-anchor="middle">12 steps • 3 models</text>
  
  <rect x="230" y="260" width="100" height="24" rx="4" fill="#16a34a" opacity="0.1"/>
  <text x="280" y="276" font-family="Geist, sans-serif" font-size="10" font-weight="500" fill="#16a34a" text-anchor="middle">Production ready</text>
</svg>