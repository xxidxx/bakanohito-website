<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <!-- Eval & Observability illustration -->
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7170ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0a72ef;stop-opacity:0.15"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="240" fill="url(#grad3)" rx="12"/>
  <rect width="400" height="240" fill="none" stroke="#7170ff" stroke-width="1" stroke-opacity="0.2" rx="12"/>
  
  <!-- Dashboard header -->
  <text x="30" y="35" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#171717">Eval Run: code-review-v2.1</text>
  <text x="30" y="52" font-family="Geist Mono, monospace" font-size="11" fill="#666666">2024-01-15 14:32 UTC • 247 samples • 3m 42s</text>
  
  <!-- Metric cards row -->
  <g font-family="Geist, sans-serif">
    <!-- Pass rate -->
    <rect x="30" y="65" width="85" height="60" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
    <text x="72.5" y="88" font-size="28" font-weight="600" fill="#27ca4f" text-anchor="middle">94.3%</text>
    <text x="72.5" y="110" font-size="11" fill="#666666" text-anchor="middle">Pass Rate</text>
    <text x="72.5" y="122" font-size="10" fill="#27ca4f" text-anchor="middle">▲ +2.1% vs baseline</text>
    
    <!-- Avg latency -->
    <rect x="125" y="65" width="85" height="60" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
    <text x="167.5" y="88" font-size="28" font-weight="600" fill="#0a72ef" text-anchor="middle">1.2s</text>
    <text x="167.5" y="110" font-size="11" fill="#666666" text-anchor="middle">Avg Latency</text>
    <text x="167.5" y="122" font-size="10" fill="#ff5b4f" text-anchor="middle">▼ -0.3s</text>
    
    <!-- Cost per 1k -->
    <rect x="220" y="65" width="85" height="60" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
    <text x="262.5" y="88" font-size="28" font-weight="600" fill="#de1d8d" text-anchor="middle">$0.042</text>
    <text x="262.5" y="110" font-size="11" fill="#666666" text-anchor="middle">Cost / 1k</text>
    <text x="262.5" y="122" font-size="10" fill="#27ca4f" text-anchor="middle">▼ -18%</text>
    
    <!-- Token efficiency -->
    <rect x="315" y="65" width="85" height="60" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
    <text x="357.5" y="88" font-size="28" font-weight="600" fill="#7170ff" text-anchor="middle">87%</text>
    <text x="357.5" y="110" font-size="11" fill="#666666" text-anchor="middle">Token Eff.</text>
    <text x="357.5" y="122" font-size="10" fill="#27ca4f" text-anchor="middle">▲ +5%</text>
  </g>
  
  <!-- Chart area -->
  <rect x="30" y="140" width="340" height="85" fill="#ffffff" stroke="#ebebeb" stroke-width="1" rx="8"/>
  
  <!-- Simple bar chart - pass/fail by category -->
  <g font-family="Geist Mono, monospace" font-size="9">
    <!-- Categories -->
    <text x="45" y="215" fill="#666666" text-anchor="middle">Syntax</text>
    <text x="115" y="215" fill="#666666" text-anchor="middle">Logic</text>
    <text x="185" y="215" fill="#666666" text-anchor="middle">Security</text>
    <text x="255" y="215" fill="#666666" text-anchor="middle">Style</text>
    <text x="325" y="215" fill="#666666" text-anchor="middle">Perf</text>
    
    <!-- Pass bars -->
    <rect x="40" y="165" width="30" height="45" rx="3 3 0 0" fill="#27ca4f" fill-opacity="0.8"/>
    <rect x="110" y="155" width="30" height="55" rx="3 3 0 0" fill="#27ca4f" fill-opacity="0.8"/>
    <rect x="180" y="170" width="30" height="40" rx="3 3 0 0" fill="#27ca4f" fill-opacity="0.8"/>
    <rect x="250" y="160" width="30" height="50" rx="3 3 0 0" fill="#27ca4f" fill-opacity="0.8"/>
    <rect x="320" y="175" width="30" height="35" rx="3 3 0 0" fill="#27ca4f" fill-opacity="0.8"/>
    
    <!-- Fail bars (small) -->
    <rect x="40" y="160" width="30" height="5" rx="0 0 3 3" fill="#ff5b4f" fill-opacity="0.8"/>
    <rect x="110" y="150" width="30" height="5" rx="0 0 3 3" fill="#ff5b4f" fill-opacity="0.8"/>
    <rect x="180" y="165" width="30" height="5" rx="0 0 3 3" fill="#ff5b4f" fill-opacity="0.8"/>
    <rect x="250" y="155" width="30" height="5" rx="0 0 3 3" fill="#ff5b4f" fill-opacity="0.8"/>
    <rect x="320" y="170" width="30" height="5" rx="0 0 3 3" fill="#ff5b4f" fill-opacity="0.8"/>
    
    <!-- Values -->
    <text x="55" y="162" fill="#27ca4f" text-anchor="middle" font-weight="500">98%</text>
    <text x="125" y="152" fill="#27ca4f" text-anchor="middle" font-weight="500">95%</text>
    <text x="195" y="167" fill="#27ca4f" text-anchor="middle" font-weight="500">91%</text>
    <text x="265" y="157" fill="#27ca4f" text-anchor="middle" font-weight="500">94%</text>
    <text x="335" y="172" fill="#27ca4f" text-anchor="middle" font-weight="500">89%</text>
  </g>
  
  <!-- Legend -->
  <rect x="300" y="145" width="60" height="24" rx="4" fill="#27ca4f" fill-opacity="0.15" stroke="#27ca4f" stroke-width="1"/>
  <text x="330" y="162" font-family="Geist, sans-serif" font-size="9" fill="#27ca4f" text-anchor="middle">Pass</text>
  <rect x="300" y="170" width="60" height="24" rx="4" fill="#ff5b4f" fill-opacity="0.15" stroke="#ff5b4f" stroke-width="1"/>
  <text x="330" y="187" font-family="Geist, sans-serif" font-size="9" fill="#ff5b4f" text-anchor="middle">Fail</text>
</svg>