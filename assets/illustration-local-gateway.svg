<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <!-- Local AI Gateway illustration -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a72ef;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7170ff;stop-opacity:0.15"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="240" fill="url(#grad1)" rx="12"/>
  <rect width="400" height="240" fill="none" stroke="#0a72ef" stroke-width="1" stroke-opacity="0.2" rx="12"/>
  
  <!-- Terminal window frame -->
  <rect x="24" y="24" width="352" height="192" fill="#0d1117" rx="8" stroke="#30363d" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="36" fill="#161b22" rx="8 8 0 0" stroke="#30363d" stroke-width="1"/>
  <circle cx="42" cy="42" r="6" fill="#ff5f56"/>
  <circle cx="60" cy="42" r="6" fill="#ffbd2e"/>
  <circle cx="78" cy="42" r="6" fill="#27ca4f"/>
  
  <!-- Terminal content -->
  <text x="40" y="78" font-family="Geist Mono, monospace" font-size="13" fill="#8b949e">$ bakanohito serve --model llama3-70b</text>
  <text x="40" y="102" font-family="Geist Mono, monospace" font-size="13" fill="#7ee787">✓ Model loaded: llama3-70b-q4_k_m (4.2 GB)</text>
  <text x="40" y="120" font-family="Geist Mono, monospace" font-size="13" fill="#7ee787">✓ API server running on http://localhost:11434</text>
  <text x="40" y="138" font-family="Geist Mono, monospace" font-size="13" fill="#7ee787">✓ OpenAI-compatible endpoints: /v1/chat/completions</text>
  <text x="40" y="156" font-family="Geist Mono, monospace" font-size="13" fill="#a5d6ff">✓ MCP server registered: 3 tools exposed</text>
  <text x="40" y="174" font-family="Geist Mono, monospace" font-size="13" fill="#d2a8ff">✓ Observability: tracing enabled (OTEL)</text>
  <text x="40" y="198" font-family="Geist Mono, monospace" font-size="13" fill="#8b949e">$ _</text>
  
  <!-- Floating badges -->
  <rect x="280" y="40" width="80" height="28" rx="14" fill="#0a72ef" fill-opacity="0.2" stroke="#0a72ef" stroke-width="1"/>
  <text x="320" y="59" font-family="Geist, sans-serif" font-size="11" font-weight="500" fill="#0a72ef" text-anchor="middle">OpenAI Compatible</text>
  
  <rect x="280" y="76" width="80" height="28" rx="14" fill="#27ca4f" fill-opacity="0.2" stroke="#27ca4f" stroke-width="1"/>
  <text x="320" y="95" font-family="Geist, sans-serif" font-size="11" font-weight="500" fill="#27ca4f" text-anchor="middle">Local First</text>
</svg>