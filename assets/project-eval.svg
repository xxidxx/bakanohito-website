<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e5e5" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a72ef" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a72ef" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- Dashboard container -->
  <rect x="20" y="20" width="360" height="240" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="360" height="44" rx="8" fill="#171717"/>
  <text x="40" y="48" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Eval Run: bakanohito/orchestrator@v2.1.0</text>
  <text x="340" y="48" font-family="Geist Mono, monospace" font-size="11" fill="#4ade80" text-anchor="end">PASSED</text>
  
  <!-- Metrics row -->
  <rect x="30" y="80" width="75" height="50" rx="6" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  <text x="67.5" y="105" font-family="Geist, sans-serif" font-size="20" font-weight="600" fill="#171717" text-anchor="middle">94.2%</text>
  <text x="67.5" y="120" font-family="Geist, sans-serif" font-size="9" fill="#666666" text-anchor="middle">Pass Rate</text>
  
  <rect x="115" y="80" width="75" height="50" rx="6" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  <text x="152.5" y="105" font-family="Geist, sans-serif" font-size="20" font-weight="600" fill="#171717" text-anchor="middle">1.2s</text>
  <text x="152.5" y="120" font-family="Geist, sans-serif" font-size="9" fill="#666666" text-anchor="middle">Avg Latency</text>
  
  <rect x="200" y="80" width="75" height="50" rx="6" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  <text x="237.5" y="105" font-family="Geist, sans-serif" font-size="20" font-weight="600" fill="#171717" text-anchor="middle">$0.003</text>
  <text x="237.5" y="120" font-family="Geist, sans-serif" font-size="9" fill="#666666" text-anchor="middle">Cost/Run</text>
  
  <rect x="285" y="80" width="95" height="50" rx="6" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  <text x="332.5" y="105" font-family="Geist, sans-serif" font-size="20" font-weight="600" fill="#171717" text-anchor="middle">1,247</text>
  <text x="332.5" y="120" font-family="Geist, sans-serif" font-size="9" fill="#666666" text-anchor="middle">Test Cases</text>
  
  <!-- Chart area -->
  <rect x="30" y="150" width="340" height="90" rx="6" fill="#fafafa" stroke="#ebebeb" stroke-width="1"/>
  
  <!-- Chart axes -->
  <line x1="50" y1="220" x2="50" y2="170" stroke="#ebebeb" stroke-width="1"/>
  <line x1="50" y1="220" x2="350" y2="220" stroke="#ebebeb" stroke-width="1"/>
  
  <!-- Chart line (pass rate over time) -->
  <path d="M50 210 Q90 200 130 195 Q170 190 210 188 Q250 185 290 184 Q330 182 350 181" stroke="#0a72ef" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Area under curve -->
  <path d="M50 220 L50 210 Q90 200 130 195 Q170 190 210 188 Q250 185 290 184 Q330 182 350 181 L350 220 Z" fill="url(#chartGradient)"/>
  
  <!-- Chart points -->
  <circle cx="50" cy="210" r="4" fill="#0a72ef"/>
  <circle cx="130" cy="195" r="4" fill="#0a72ef"/>
  <circle cx="210" cy="188" r="4" fill="#0a72ef"/>
  <circle cx="290" cy="184" r="4" fill="#0a72ef"/>
  <circle cx="350" cy="181" r="4" fill="#0a72ef"/>
  
  <!-- X-axis labels -->
  <text x="50" y="232" font-family="Geist Mono, monospace" font-size="8" fill="#8a8a8a" text-anchor="middle">Run 1</text>
  <text x="130" y="232" font-family="Geist Mono, monospace" font-size="8" fill="#8a8a8a" text-anchor="middle">Run 5</text>
  <text x="210" y="232" font-family="Geist Mono, monospace" font-size="8" fill="#8a8a8a" text-anchor="middle">Run 10</text>
  <text x="290" y="232" font-family="Geist Mono, monospace" font-size="8" fill="#8a8a8a" text-anchor="middle">Run 15</text>
  <text x="350" y="232" font-family="Geist Mono, monospace" font-size="8" fill="#8a8a8a" text-anchor="middle">Run 20</text>
  
  <!-- Y-axis labels -->
  <text x="40" y="224" font-family="Geist Mono, monospace" font-size="8" fill="#8a8a8a" text-anchor="end">80%</text>
  <text x="40" y="194" font-family="Geist Mono, monospace" font-size="8" fill="#8a8a8a" text-anchor="end">90%</text>
  <text x="40" y="174" font-family="Geist Mono, monospace" font-size="8" fill="#8a8a8a" text-anchor="end">95%</text>
  <text x="40" y="164" font-family="Geist Mono, monospace" font-size="8" fill="#8a8a8a" text-anchor="end">100%</text>
  
  <!-- Legend -->
  <rect x="280" y="160" width="80" height="20" rx="3" fill="#0a72ef" opacity="0.1" stroke="#0a72ef" stroke-width="1"/>
  <text x="320" y="174" font-family="Geist, sans-serif" font-size="9" fill="#0a72ef" text-anchor="middle">Pass Rate Trend</text>
</svg>