<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#171717"/>
  
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="28" stroke="#0a72ef" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Main symbol: Abstract "B" + neural node network -->
  <g transform="translate(16, 16)">
    <!-- Neural nodes -->
    <circle cx="8" cy="8" r="3" fill="#0a72ef" opacity="0.9"/>
    <circle cx="24" cy="8" r="3" fill="#0a72ef" opacity="0.7"/>
    <circle cx="16" cy="20" r="3" fill="#0a72ef" opacity="0.8"/>
    <circle cx="8" cy="32" r="3" fill="#0a72ef" opacity="0.6"/>
    <circle cx="24" cy="32" r="3" fill="#0a72ef" opacity="0.7"/>
    <circle cx="16" cy="44" r="3" fill="#0a72ef" opacity="0.9"/>
    
    <!-- Connections forming a subtle B shape -->
    <path d="M11 8 L13 14 Q16 18 16 20 Q16 22 13 26 L11 32" stroke="#0a72ef" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M21 8 L19 14 Q16 18 16 20 Q16 22 19 26 L21 32" stroke="#0a72ef" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M8 11 L14 13 Q18 16 20 20 L20 24 Q18 28 14 30 L8 32" stroke="#0a72ef" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>
    <path d="M8 35 L14 37 Q18 40 20 44" stroke="#0a72ef" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>
    <path d="M20 35 L18 37 Q14 40 12 44" stroke="#0a72ef" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>
    
    <!-- Central pulse -->
    <circle cx="16" cy="20" r="6" stroke="#0a72ef" stroke-width="1" fill="none" opacity="0.2">
      <animate attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.05;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Accent dots -->
  <circle cx="50" cy="14" r="2" fill="#0a72ef" opacity="0.5"/>
  <circle cx="54" cy="50" r="1.5" fill="#0a72ef" opacity="0.4"/>
  <circle cx="10" cy="54" r="1.5" fill="#0a72ef" opacity="0.3"/>
</svg>